<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World · FastAPI + Cloudflare</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font: 18px system-ui, sans-serif; }
    main { max-width: 560px; margin: 24px; padding: 36px; border: 1px solid #334155; border-radius: 20px; background: #1e293b; }
    h1 { font-size: 42px; margin-top: 0; }
    p { line-height: 1.6; }
    button { background: #38bdf8; color: #0f172a; border: 0; border-radius: 8px; padding: 12px 20px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 20px; background: #0f172a; border-radius: 8px; }
    a { color: #38bdf8; }
    small { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world 👋</h1>
    <p>Frontend on <strong>Cloudflare</strong>.<br>FastAPI backend on <strong>Render</strong>.</p>
    <button id="load">Call the API</button>
    <pre id="result" role="status" aria-live="polite">Ready to connect.</pre>
    <p><small>The free Render backend may take a minute to wake up.</small></p>
    <a href="https://fastapi-hello-world-i205.onrender.com/docs" target="_blank" rel="noopener">API documentation ↗</a>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
